<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0,255,180,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,180,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(40px); }
  }

  .glow-orb {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
  }
  .glow-orb-1 { background: #00ffb4; top: -100px; left: -100px; animation: float1 8s ease-in-out infinite; }
  .glow-orb-2 { background: #7b2fff; bottom: -100px; right: -100px; animation: float2 10s ease-in-out infinite; }

  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(50px,30px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-20px)} }

  .calculator {
    position: relative;
    width: 340px;
    background: linear-gradient(145deg, #12121a, #0d0d15);
    border-radius: 24px;
    padding: 24px;
    border: 1px solid rgba(0,255,180,0.15);
    box-shadow: 
      0 0 0 1px rgba(0,255,180,0.05),
      0 30px 80px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.05);
    animation: calcAppear 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes calcAppear {
    from { transform: scale(0.8) translateY(30px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .calc-header {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(0,255,180,0.4);
    text-align: center;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .display-wrapper {
    background: #07070f;
    border-radius: 16px;
    padding: 20px 20px 16px;
    margin-bottom: 20px;
    border: 1px solid rgba(0,255,180,0.08);
    position: relative;
    overflow: hidden;
  }

  .display-wrapper::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,255,180,0.3), transparent);
  }

  .expression {
    font-size: 13px;
    color: rgba(0,255,180,0.35);
    text-align: right;
    min-height: 18px;
    margin-bottom: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 1px;
  }

  .display {
    font-family: 'Orbitron', monospace;
    font-size: 42px;
    font-weight: 700;
    color: #00ffb4;
    text-align: right;
    min-height: 52px;
    line-height: 1;
    text-shadow: 0 0 20px rgba(0,255,180,0.5), 0 0 40px rgba(0,255,180,0.2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: all 0.1s;
  }

  .display.small { font-size: 28px; }
  .display.tiny { font-size: 20px; }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    position: relative;
    height: 68px;
    border: none;
    border-radius: 14px;
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.12s cubic-bezier(0.34,1.56,0.64,1);
    overflow: hidden;
    letter-spacing: 0.5px;
  }

  button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
    border-radius: inherit;
  }

  button:active {
    transform: scale(0.92);
  }

  /* Number buttons */
  .btn-num {
    background: linear-gradient(145deg, #1a1a2e, #16162a);
    color: #e0e0ff;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    font-family: 'Share Tech Mono', monospace;
    font-size: 20px;
  }

  .btn-num:hover {
    background: linear-gradient(145deg, #22223a, #1e1e32);
    color: #ffffff;
    border-color: rgba(0,255,180,0.2);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 15px rgba(0,255,180,0.05);
    transform: translateY(-2px);
  }

  /* Operator buttons */
  .btn-op {
    background: linear-gradient(145deg, #1a1535, #130f2a);
    color: #a78bff;
    border: 1px solid rgba(123,47,255,0.2);
    box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 10px rgba(123,47,255,0.05);
    font-size: 20px;
  }

  .btn-op:hover {
    background: linear-gradient(145deg, #221a42, #1a1235);
    color: #c4b0ff;
    border-color: rgba(123,47,255,0.4);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 20px rgba(123,47,255,0.15);
    transform: translateY(-2px);
  }

  /* Clear/special buttons */
  .btn-clear {
    background: linear-gradient(145deg, #2a1018, #200c12);
    color: #ff6b8a;
    border: 1px solid rgba(255,107,138,0.2);
    box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 10px rgba(255,107,138,0.05);
    font-size: 13px;
    letter-spacing: 1px;
  }

  .btn-clear:hover {
    background: linear-gradient(145deg, #351220, #280e18);
    color: #ff8fab;
    border-color: rgba(255,107,138,0.4);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 20px rgba(255,107,138,0.15);
    transform: translateY(-2px);
  }

  /* Equals button */
  .btn-eq {
    background: linear-gradient(145deg, #00c896, #009970);
    color: #001a12;
    border: 1px solid rgba(0,255,180,0.3);
    box-shadow: 0 4px 20px rgba(0,200,150,0.3), 0 0 30px rgba(0,255,180,0.1);
    font-size: 24px;
  }

  .btn-eq:hover {
    background: linear-gradient(145deg, #00e5a8, #00b882);
    box-shadow: 0 6px 25px rgba(0,200,150,0.5), 0 0 40px rgba(0,255,180,0.2);
    transform: translateY(-3px);
  }

  .btn-zero {
    grid-column: span 2;
  }

  /* Ripple effect */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transform: scale(0);
    animation: rippleAnim 0.4s linear;
    pointer-events: none;
  }

  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  /* Error shake */
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }

  .display.error {
    color: #ff6b8a;
    text-shadow: 0 0 20px rgba(255,107,138,0.5);
    animation: shake 0.4s ease;
  }

  /* Number pop animation */
  @keyframes numPop {
    0%{transform:scale(1.1)}
    100%{transform:scale(1)}
  }

  .display.pop { animation: numPop 0.1s ease; }
</style>
</head>
<body>

<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>

<div class="calculator">
  <div class="calc-header">⬡ CALC-X ⬡</div>

  <div class="display-wrapper">
    <div class="expression" id="expression"></div>
    <div class="display" id="display">0</div>
  </div>

  <div class="buttons">
    <button class="btn-clear" onclick="clearAll(this)">AC</button>
    <button class="btn-clear" onclick="toggleSign(this)">+/−</button>
    <button class="btn-clear" onclick="percentage(this)">%</button>
    <button class="btn-op" onclick="setOp('/', this)">÷</button>

    <button class="btn-num" onclick="appendNum('7', this)">7</button>
    <button class="btn-num" onclick="appendNum('8', this)">8</button>
    <button class="btn-num" onclick="appendNum('9', this)">9</button>
    <button class="btn-op" onclick="setOp('*', this)">×</button>

    <button class="btn-num" onclick="appendNum('4', this)">4</button>
    <button class="btn-num" onclick="appendNum('5', this)">5</button>
    <button class="btn-num" onclick="appendNum('6', this)">6</button>
    <button class="btn-op" onclick="setOp('-', this)">−</button>

    <button class="btn-num" onclick="appendNum('1', this)">1</button>
    <button class="btn-num" onclick="appendNum('2', this)">2</button>
    <button class="btn-num" onclick="appendNum('3', this)">3</button>
    <button class="btn-op" onclick="setOp('+', this)">+</button>

    <button class="btn-num btn-zero" onclick="appendNum('0', this)">0</button>
    <button class="btn-num" onclick="appendDot(this)">.</button>
    <button class="btn-eq" onclick="calculate(this)">=</button>
  </div>
</div>

<script>
  let current = '0';
  let previous = '';
  let operator = null;
  let shouldReset = false;

  const display = document.getElementById('display');
  const expression = document.getElementById('expression');

  function updateDisplay(val) {
    display.className = 'display';
    let str = String(val);
    if (str.length > 12) str = parseFloat(val).toExponential(4);
    display.textContent = str;
    if (str.length > 9) display.classList.add('small');
    if (str.length > 13) display.classList.add('tiny');
    void display.offsetWidth;
    display.classList.add('pop');
  }

  function ripple(btn, e) {
    const r = document.createElement('span');
    r.className = 'ripple';
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    btn.appendChild(r);
    setTimeout(() => r.remove(), 400);
  }

  function appendNum(num, btn) {
    if (btn) ripple(btn, event);
    if (shouldReset) { current = num; shouldReset = false; }
    else current = current === '0' ? num : current + num;
    updateDisplay(current);
  }

  function appendDot(btn) {
    if (btn) ripple(btn, event);
    if (shouldReset) { current = '0.'; shouldReset = false; }
    else if (!current.includes('.')) current += '.';
    updateDisplay(current);
  }

  function setOp(op, btn) {
    if (btn) ripple(btn, event);
    if (operator && !shouldReset) calculate();
    previous = current;
    operator = op;
    shouldReset = true;
    const symbols = {'+':'+', '-':'−', '*':'×', '/':'÷'};
    expression.textContent = previous + ' ' + symbols[op];
  }

  function calculate(btn) {
    if (btn) ripple(btn, event);
    if (!operator || !previous) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    const symbols = {'+':'+', '-':'−', '*':'×', '/':'÷'};
    expression.textContent = previous + ' ' + symbols[operator] + ' ' + current + ' =';
    let result;
    switch(operator) {
      case '+': result = a + b; break;
      case '-': result = a - b; break;
      case '*': result = a * b; break;
      case '/':
        if (b === 0) {
          display.className = 'display error';
          display.textContent = 'Error';
          current = '0'; operator = null; previous = '';
          return;
        }
        result = a / b; break;
    }
    result = parseFloat(result.toFixed(10));
    current = String(result);
    operator = null;
    shouldReset = true;
    updateDisplay(result);
  }

  function clearAll(btn) {
    if (btn) ripple(btn, event);
    current = '0'; previous = ''; operator = null; shouldReset = false;
    expression.textContent = '';
    updateDisplay('0');
  }

  function toggleSign(btn) {
    if (btn) ripple(btn, event);
    current = String(parseFloat(current) * -1);
    updateDisplay(current);
  }

  function percentage(btn) {
    if (btn) ripple(btn, event);
    current = String(parseFloat(current) / 100);
    updateDisplay(current);
  }

  // Keyboard support
  document.addEventListener('keydown', e => {
    if ('0123456789'.includes(e.key)) appendNum(e.key);
    else if (e.key === '.') appendDot();
    else if (e.key === '+') setOp('+');
    else if (e.key === '-') setOp('-');
    else if (e.key === '*') setOp('*');
    else if (e.key === '/') { e.preventDefault(); setOp('/'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') {
      if (current.length > 1) current = current.slice(0,-1);
      else current = '0';
      updateDisplay(current);
    }
  });
</script>
</body>
</html>
